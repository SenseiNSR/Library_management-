{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2 class="section-title">Add New Member</h2>
    <a href="{{ url_for('members') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Members</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_member') }}" class="classy-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g., John Doe">
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="e.g., john@example.com">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number (Optional)</label>
            <input type="text" id="phone" name="phone" placeholder="e.g., 555-1234">
        </div>
        
        <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Save Member</button>
    </form>
</div>
{% endblock %}
